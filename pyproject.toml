[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feilian-cli"
version = "0.1.3"
description = "飞连开放平台 OpenAPI 命令行工具（IT 管理员用）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "rich>=12.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "respx>=0.20"]

[project.scripts]
feilian = "feilian_cli.main:cli"
fl = "feilian_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feilian_cli = ["spec/*.json"]
